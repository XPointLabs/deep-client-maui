name: strict-client-release-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-client-evidence:
    runs-on: [self-hosted, Windows, deep-client-lab]
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-client-maui
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          token: ${{ secrets.DEEP_CI_REPO_TOKEN }}
          path: deep-client-shared
          ref: 2e55f78c68699520e49ec0c8d5ddebd4b9817584
      - name: Bind one release invocation
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          $releaseInvocation = [Guid]::NewGuid().ToString('N')
          "DEEP_RELEASE_INVOCATION_ID=$releaseInvocation" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Provision signed protected Android lab inventory
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          dotnet build eng/Deep.AndroidLab.PolicyVerifier/Deep.AndroidLab.PolicyVerifier.csproj `
            -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Android policy verifier build failed.' }
          $policyPath = ./eng/Provision-AndroidLabPolicy.ps1 `
            -SourceRoot $env:DEEP_ANDROID_LAB_PROTECTED_SOURCE `
            -ExpectedOwner $env:DEEP_ANDROID_LAB_EXPECTED_OWNER `
            -MrXPublicKeySha256 $env:DEEP_MR_X_PUBLIC_KEY_SHA256
          "DEEP_ANDROID_LAB_POLICY=$policyPath" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Build Debug clients
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          $projectRoot = 'src/Deep.Client.Maui'
          foreach ($candidate in @(
            "$projectRoot/bin/Debug/net10.0-windows10.0.19041.0",
            "$projectRoot/obj/Debug/net10.0-windows10.0.19041.0",
            "$projectRoot/bin/Debug/net10.0-android",
            "$projectRoot/obj/Debug/net10.0-android")) {
            if (Test-Path -LiteralPath $candidate) {
              Remove-Item -LiteralPath $candidate -Recurse -Force
            }
          }
          dotnet build src/Deep.Client.Maui/Deep.Client.Maui.csproj -f net10.0-windows10.0.19041.0 -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Windows Debug build failed.' }
          dotnet build src/Deep.Client.Maui/Deep.Client.Maui.csproj -f net10.0-android -c Debug -p:DeepPhysicalE2E=true
          if ($LASTEXITCODE -ne 0) { throw 'Android Debug E2E build failed.' }

          $windowsExecutables = @(Get-ChildItem `
            -LiteralPath "$projectRoot/bin/Debug/net10.0-windows10.0.19041.0" `
            -Filter 'Deep.Client.Maui.exe' -File -Recurse)
          if ($windowsExecutables.Count -ne 1) {
            throw "Expected exactly one just-built Windows executable; found $($windowsExecutables.Count)."
          }
          $androidPackages = @(Get-ChildItem `
            -LiteralPath "$projectRoot/bin/Debug/net10.0-android" `
            -Filter 'network.xpoint.deep.e2e-Signed.apk' -File -Recurse)
          if ($androidPackages.Count -ne 1) {
            throw "Expected exactly one just-built Android E2E APK; found $($androidPackages.Count)."
          }
          "DEEP_WINDOWS_EXE=$($windowsExecutables[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "DEEP_ANDROID_APK=$($androidPackages[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Strict Windows rendered acceptance
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          ./eng/Invoke-StrictClientLane.ps1 -Lane WindowsUi `
            -ReleaseInvocationId $env:DEEP_RELEASE_INVOCATION_ID -Bootstrap live `
            -AppPath $env:DEEP_WINDOWS_EXE -ArtifactDirectory artifacts/survival/I01-MAUI-STRICT-GATES
      - name: Strict Android physical-device acceptance
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          ./eng/Invoke-StrictClientLane.ps1 -Lane AndroidDevice `
            -ReleaseInvocationId $env:DEEP_RELEASE_INVOCATION_ID `
            -ApkPath $env:DEEP_ANDROID_APK -AndroidSerial $env:DEEP_ANDROID_SERIAL `
            -AndroidLabPolicyPath $env:DEEP_ANDROID_LAB_POLICY `
            -MrXPublicKeySha256 $env:DEEP_MR_X_PUBLIC_KEY_SHA256 -ConfigureAdbReverse `
            -ArtifactDirectory artifacts/survival/I01-MAUI-STRICT-GATES
      - name: Optional physical Android to Windows rendered flow
        if: ${{ vars.DEEP_RUN_CROSS_PLATFORM_UI == '1' }}
        working-directory: deep-client-maui
        shell: pwsh
        env:
          DEEP_STRICT_CROSS_PLATFORM_UI: '1'
          DEEP_E2E_BOOTSTRAP: live
          DEEP_MR_X_PUBLIC_KEY_SHA256: ${{ secrets.DEEP_MR_X_PUBLIC_KEY_SHA256 }}
          DEEP_E2E_ADB: ${{ vars.DEEP_CROSS_PLATFORM_ADB_PATH }}
          DEEP_E2E_AAPT: ${{ vars.DEEP_CROSS_PLATFORM_AAPT_PATH }}
          DEEP_E2E_APKSIGNER: ${{ vars.DEEP_CROSS_PLATFORM_APKSIGNER_PATH }}
          DEEP_E2E_ANDROID_SERIAL: ${{ secrets.DEEP_ANDROID_SERIAL }}
          DEEP_E2E_ATTACHMENT_FIXTURE: ${{ vars.DEEP_CROSS_PLATFORM_ATTACHMENT_FIXTURE }}
          DEEP_E2E_ARTIFACTS: ${{ github.workspace }}\deep-client-maui\artifacts\survival\I01-MAUI-STRICT-GATES
          DEEP_E2E_APPDATA_ROOT: ${{ github.workspace }}\deep-client-maui\artifacts\survival\I01-MAUI-STRICT-GATES\cross-platform-appdata
          DEEP_E2E_ANDROID_SELECTORS_JSON: ${{ secrets.DEEP_CROSS_PLATFORM_ANDROID_SELECTORS_JSON }}
          DEEP_E2E_ANDROID_PICKER_DOWNLOADS_ID: ${{ vars.DEEP_CROSS_PLATFORM_PICKER_DOWNLOADS_ID }}
          DEEP_E2E_ANDROID_PICKER_FILE_ID: ${{ vars.DEEP_CROSS_PLATFORM_PICKER_FILE_ID }}
          DEEP_E2E_ANDROID_PICKER_CONFIRM_ID: ${{ vars.DEEP_CROSS_PLATFORM_PICKER_CONFIRM_ID }}
        run: |
          $env:DEEP_MAUI_EXE = $env:DEEP_WINDOWS_EXE
          $env:DEEP_E2E_ANDROID_APK = $env:DEEP_ANDROID_APK
          $env:DEEP_E2E_ANDROID_POLICY = $env:DEEP_ANDROID_LAB_POLICY
          dotnet test tests/Deep.Client.Maui.UiTests/Deep.Client.Maui.UiTests.csproj --no-restore `
            --filter FullyQualifiedName~StrictCrossPlatformUiTests
          if ($LASTEXITCODE -ne 0) { throw 'Optional physical cross-platform UI flow failed.' }
      - name: Validate fresh commit-bound evidence
        working-directory: deep-client-maui
        shell: pwsh
        run: |
          $crossPlatformArguments = @{}
          if ('${{ vars.DEEP_RUN_CROSS_PLATFORM_UI }}' -eq '1') {
            $crossPlatformArguments.CrossPlatformPolicyPath = $env:DEEP_ANDROID_LAB_POLICY
            $crossPlatformArguments.CrossPlatformWindowsExePath = $env:DEEP_WINDOWS_EXE
            $crossPlatformArguments.CrossPlatformAttachmentFixturePath = '${{ vars.DEEP_CROSS_PLATFORM_ATTACHMENT_FIXTURE }}'
          }
          ./eng/Test-StrictClientEvidence.ps1 -RequireComplete @crossPlatformArguments `
            -ReleaseInvocationId $env:DEEP_RELEASE_INVOCATION_ID `
            -AndroidLabPolicyPath $env:DEEP_ANDROID_LAB_POLICY `
            -AndroidApkPath $env:DEEP_ANDROID_APK `
            -MrXPublicKeySha256 $env:DEEP_MR_X_PUBLIC_KEY_SHA256 `
            -ArtifactDirectory artifacts/survival/I01-MAUI-STRICT-GATES
      - name: Clean protected Android lab inventory
        if: always()
        working-directory: deep-client-maui
        shell: pwsh
        run: ./eng/Provision-AndroidLabPolicy.ps1 -Clean
      - name: Upload sanitized strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-client-release-evidence
          path: |
            deep-client-maui/artifacts/survival/I01-MAUI-STRICT-GATES/*.json
            deep-client-maui/artifacts/survival/I01-MAUI-STRICT-GATES/windows-ui/windows-ui-result.json
            deep-client-maui/artifacts/survival/I01-MAUI-STRICT-GATES/windows-ui/windows-ui-tree.txt
            deep-client-maui/artifacts/survival/I01-MAUI-STRICT-GATES/cross-platform-ui-result.json
          if-no-files-found: error
